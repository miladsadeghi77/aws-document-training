logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
#    root: INFO
#    org.springframework.web: DEBUG
#    com.amazonaws: DEBUG
    com.zaxxer.hikari: DEBUG

spring:
  application.name: aws-document
  task:
    scheduling:
      pool:
        size: 3
  datasource:
      url: jdbc:postgresql://localhost:5436/oms
      username: oms
      password: oms
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 3000
        max-lifetime: 1800000
        leak-detection-threshold: 20000
#    url: jdbc:postgresql://localhost:5436/oms
#    username: oms
#    password: oms
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
aws:
  sns:
    topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:oms-document-uploaded}
  sqs:
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/oms-documents}
  credentials:
    access-key: "test"
    secret-key: "test"
  s3:
    bucket: oms-documents
    endpoint: ${AWS_ENDPOINT:https://s3.amazonaws.com}
    region: ${AWS_REGION:us-east-1}
  dynamodb:
    table-name: oms-document-processing
server:
  port: 8088